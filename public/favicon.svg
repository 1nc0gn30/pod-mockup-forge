<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="lensCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0A0B10" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#primaryGlow)" stroke-width="2" stroke-opacity="0.6" />
  <!-- Studio Lens Body -->
  <circle cx="50" cy="50" r="34" fill="url(#lensCore)" stroke="#E5A93C" stroke-width="2" />
  <circle cx="50" cy="50" r="26" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8" />
  <!-- Aperture Blades -->
  <path d="M 50 26 L 68 40 L 58 56 Z" fill="#E5A93C" fill-opacity="0.3" stroke="#E5A93C" stroke-width="1" />
  <path d="M 68 40 L 64 64 L 46 58 Z" fill="#A855F7" fill-opacity="0.3" stroke="#A855F7" stroke-width="1" />
  <path d="M 64 64 L 42 72 L 40 52 Z" fill="#6366F1" fill-opacity="0.3" stroke="#6366F1" stroke-width="1" />
  <path d="M 42 72 L 32 50 L 50 44 Z" fill="#E5A93C" fill-opacity="0.3" stroke="#E5A93C" stroke-width="1" />
  <!-- Center Flash Aperture -->
  <circle cx="50" cy="50" r="8" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="47" cy="47" r="3" fill="#FFFFFF" opacity="0.9" />
</svg>
